# Server
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/promptbench
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# OpenRouter API
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.model=${LLM_MODEL:meta-llama/llama-3.1-8b-instruct:free}

# Cost per 1M tokens (USD)
openrouter.price.input=${LLM_INPUT_PRICE_PER_MILLION:0}
openrouter.price.output=${LLM_OUTPUT_PRICE_PER_MILLION:0}

# Static resources
spring.web.resources.static-locations=classpath:/static/
